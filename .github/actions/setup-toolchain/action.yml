name: Set up project toolchain
description: Installs the Node.js and pnpm versions declared by the repository.

runs:
  using: composite
  steps:
    - id: pnpm-version
      name: Read pnpm version from package.json
      shell: bash
      run: |
        package_manager="$(node -p 'require("./package.json").packageManager')"
        case "${package_manager}" in
          pnpm@*)
            version="${package_manager#pnpm@}"
            echo "version=${version%%+*}" >> "$GITHUB_OUTPUT"
            ;;
          *) echo "package.json must declare packageManager as pnpm@<version>." >&2; exit 1 ;;
        esac

    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ steps.pnpm-version.outputs.version }}

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
